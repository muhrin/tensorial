_target_: tensorial.gcnn.data.GraphDataModule.from_random_split
dataset:
  _target_: tensorial.datasets.Qm9
  data_dir: ${paths.data_dir}
  limit: ${oc.select:data_limit,10000}
  as_graphs:
    r_max: ${r_max}
    graph_attrs:
      - [U0, energy]

batch_size: 32
train_val_test_split: [ 0.85, 0.05, 0.1 ]
