# requires: sitraj.xyz
_target_: tensorial.gcnn.data.ase_graph_module_random_split

path: ${paths.data_dir}/sitraj.xyz
# Set `data_limit` (e.g. in debug=smoke) to read only the first few structures of each file
limit: ${oc.select:data_limit,null}
as_graphs:
  r_max: ${r_max}
  atom_include_keys:
    - numbers
    - forces
  global_include_keys:
    - energy
    - stress
train_val_test_split: [ 0.8, 0.1, 0.1 ]
batch_size: 32
